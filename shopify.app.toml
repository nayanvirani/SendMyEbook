# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "644b9f2d2c564cbccdf56d768c402729"
name = "SendMyEbook"
application_url = "https://sendmyebook-production.up.railway.app/"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,read_orders,read_returns"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://sendmyebook-production.up.railway.app/auth/callback" ]

[webhooks]
api_version = "2026-07"

# Mandatory GDPR compliance topics. Declared here (rather than registered
# dynamically per-shop like the topics in ShopifyGraphQLClient) because
# Shopify requires these regardless of whether a shop has ever completed
# install, and delivers them automatically once this config is deployed.
[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request"]
uri = "https://sendmyebook-production.up.railway.app/api/webhooks/customers-data-request"

[[webhooks.subscriptions]]
compliance_topics = ["customers/redact"]
uri = "https://sendmyebook-production.up.railway.app/api/webhooks/customers-redact"

[[webhooks.subscriptions]]
compliance_topics = ["shop/redact"]
uri = "https://sendmyebook-production.up.railway.app/api/webhooks/shop-redact"

# Shopify App Pricing is enabled for this app (configured in the Partner
# Dashboard, not here) — merchants pick a plan on Shopify's own hosted
# page and Shopify creates the subscription itself. This app never calls
# appSubscriptionCreate; it only ever learns about a subscription via this
# webhook. Declared here (not per-shop dynamic registration) so it's
# guaranteed regardless of when a shop was provisioned.
[[webhooks.subscriptions]]
topics = ["app_subscriptions/update"]
uri = "https://sendmyebook-production.up.railway.app/api/webhooks/app-subscriptions-update"
